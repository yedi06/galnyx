<div style="position:relative; width:390px; background:var(--bg); color:var(--text);">
<!--@MHEADER:1@-->

  <!-- ============ galería ============ -->
  <div class="pbg" style="height:460px;">
    <span class="kicker" style="position:absolute; top:14px; left:14px; z-index:4; font-size:9.5px; background:var(--accent); color:var(--on-accent); padding:5px 10px; border-radius:4px;">DEL CATÁLOGO</span>
    <div class="ember" style="left:44%; animation-delay:0.6s;"></div>
    <!--@IMG:mascara-goma-17-michael-myers:400@-->
    
  </div>


  <!-- ============ información ============ -->
  <div style="padding:22px 20px 0 20px;">
    <div class="kicker" style="font-size:10px; color:var(--accent); margin-bottom:10px;"><!--@P:mascara-goma-17-michael-myers:cat@--></div>
    <h1 class="dsp" style="font-weight:800; font-size:38px; line-height:1.02; letter-spacing:-0.03em; color:var(--text-hi); margin:0 0 12px 0;"><!--@P:mascara-goma-17-michael-myers:nombre@--></h1>
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;"></div>

    <div style="display:flex; align-items:baseline; gap:10px; margin-bottom:6px;">
      <span class="dsp" style="font-weight:800; font-size:36px; color:var(--text-hi);"><!--@P:mascara-goma-17-michael-myers:precio@--></span>
    </div>

    <!-- material siempre visible -->
    <div style="display:flex; gap:7px; margin-bottom:22px;">
      <span class="mono" style="font-size:9.5px; letter-spacing:0.09em; border:1px solid var(--border); color:var(--text-muted); padding:5px 10px; border-radius:5px;"><!--@P:mascara-goma-17-michael-myers:cat@--></span>
      <span class="mono" style="font-size:9.5px; letter-spacing:0.09em; border:1px solid var(--border); color:var(--text-muted); padding:5px 10px; border-radius:5px;">TALLA ÚNICA</span>
    </div>

    <!-- acabado -->
    <div style="border-top:1px solid var(--card); padding-top:20px; margin-bottom:20px;">
    </div>

    <!-- stock -->
    <div style="background:var(--bg-raised); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:24px;">
      <div style="display:flex; flex-direction:column; gap:7px; font-size:12.5px; color:var(--text-faint); line-height:1.6; margin-bottom:22px;">
      <span>Entrega en 24–48 h en Lima Metropolitana.</span>
      <span>Cambios en 7 días si la pieza no ha sido usada.</span>
    </div>

    <!-- descripción -->
    <div style="border-top:1px solid var(--card); padding:18px 0;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
        <span style="font-size:14.5px; font-weight:600; color:var(--text-hi);">Descripción</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="transform:rotate(180deg);"><path d="M6 9.5l6 6 6-6" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <p style="font-size:13.5px; color:var(--text-muted); line-height:1.75; margin:0;"><!--@P:mascara-goma-17-michael-myers:desc@--></p>
    </div>
    <div style="border-top:1px solid var(--card); padding:18px 0; display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:14.5px; font-weight:600; color:var(--text-hi);">Medidas y talla</span>
      <!--@ICON:chev@-->
    </div>
    <div style="border-top:1px solid var(--card); border-bottom:1px solid var(--card); padding:18px 0; display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:14.5px; font-weight:600; color:var(--text-hi);">Envíos y cambios</span>
      <!--@ICON:chev@-->
    </div>
  </div>

  <!-- ============ relacionados ============ -->
  <div style="padding:32px 20px 0 20px;">
    <h2 class="dsp" style="font-weight:700; font-size:24px; letter-spacing:-0.02em; color:var(--text-hi); margin:0 0 16px 0;">Va bien con</h2>
    <div style="display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px;">
      <div style="background:var(--bg-raised); border:1px solid var(--line); border-radius:12px; overflow:hidden;">
        <div class="pbg" style="height:180px;"><!--@IMG:45-scary-movie:162@--></div>
        <div style="padding:14px;">
          <h3 class="dsp" style="font-weight:700; font-size:15px; color:var(--text-hi); margin:0;"><!--@P:45-scary-movie:nombre@--></h3>
          <div class="mono" style="font-size:9px; letter-spacing:0.09em; color:var(--text-faint); margin:7px 0 9px 0;"><!--@P:45-scary-movie:cat@--></div>
          <span class="dsp" style="font-weight:700; font-size:16px; color:var(--text-hi);"><!--@P:45-scary-movie:precio@--></span>
        </div>
      </div>
      <div style="background:var(--bg-raised); border:1px solid var(--line); border-radius:12px; overflow:hidden;">
        <div class="pbg" style="height:180px;"><!--@IMG:mascara-goma-12-leatherface-mascacre-en-texas:162@--></div>
        <div style="padding:14px;">
          <h3 class="dsp" style="font-weight:700; font-size:15px; color:var(--text-hi); margin:0;"><!--@P:mascara-goma-12-leatherface-mascacre-en-texas:nombre@--></h3>
          <div class="mono" style="font-size:9px; letter-spacing:0.09em; color:var(--text-faint); margin:7px 0 9px 0;"><!--@P:mascara-goma-12-leatherface-mascacre-en-texas:cat@--></div>
          <span class="dsp" style="font-weight:700; font-size:16px; color:var(--text-hi);"><!--@P:mascara-goma-12-leatherface-mascacre-en-texas:precio@--></span>
        </div>
      </div>
    </div>
  </div>

  <div style="height:40px;"></div>
<!--@MFOOTER@-->

  <!-- ============ barra de compra fija ============ -->
  <div style="position:sticky; bottom:0; z-index:40; display:flex; align-items:center; gap:10px; padding:12px 20px 16px 20px; background:rgba(var(--bg-rgb),0.97); border-top:1px solid var(--border);">
    <div style="display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:9px; height:50px; padding:0 12px; flex-shrink:0;">
      <span style="width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--text-faint);">−</span>
      <span class="mono" style="font-size:14px; color:var(--text-hi); width:14px; text-align:center;">1</span>
      <span style="width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--text);">+</span>
    </div>
    <div class="btn-p" style="flex-grow:1; height:50px; display:flex; align-items:center; justify-content:center; font-size:15px;">Agregar · <!--@P:mascara-goma-17-michael-myers:precio@--></div>
  </div>
</div>
