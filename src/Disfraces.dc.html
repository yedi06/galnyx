<!-- Catálogo de disfraces. Sin data-collection a propósito: el tema propio
     está reservado a Cuentos de hadas (play) y Glamour adulto (glamour); una
     página que cruza todas las categorías va en el verde por defecto.
     Las tarjetas las genera el build leyendo imagenes/Disfraces/NN */producto.txt
     -- aquí no se escribe ningún dato de producto a mano. -->
<div style="position:relative; width:1440px; background:var(--bg); color:var(--text);">
<!--@HEADER:catalogo:2:sticky@-->

  <div style="padding:22px 64px 0 64px;">
    <div style="font-size:12.5px; color:var(--text-faintest);">Inicio &nbsp;/&nbsp; <span style="color:var(--text-muted);">Disfraces</span></div>
  </div>

  <!-- ============ encabezado ============ -->
  <div style="padding:34px 64px 0 64px;">
    <div class="kicker" style="font-size:11px; color:var(--accent); margin-bottom:18px; letter-spacing:0.16em;">Catálogo · disfraces</div>
    <h1 class="dsp" style="font-weight:700; font-size:64px; line-height:1.02; letter-spacing:-0.025em; color:var(--text-hi); margin:0;">Disfraces</h1>

    <div style="display:flex; align-items:baseline; gap:34px; margin-top:26px;">
      <div>
        <span class="dsp" style="font-weight:700; font-size:26px; color:var(--text-hi);"><!--@N:disfraces@--></span>
        <span style="font-size:12px; color:var(--text-faint); margin-left:8px;">modelos en catálogo</span>
      </div>
    </div>
  </div>

  <!-- ============ grilla — orden de carpeta, 01 → 20 ============ -->
  <div style="padding:34px 64px 80px 64px;">
    <div style="display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:26px;">
<!--@DISFRACES@-->
    </div>
  </div>

<!--@FOOTER@-->
<!--@FAB@-->
</div>
