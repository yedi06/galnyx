<!-- Página de historia de UN producto (aquí, Michael Myers). Es la plantilla:
     las otras 11 historias usan esta misma estructura cambiando el slug de los
     marcadores. Nada está escrito a mano — el texto sale de
     scripts/historias.json y los datos del producto del inventario.

     La página está armada para vender al final de la lectura: historia arriba,
     y al terminar de bajar aparece la pieza con su foto, su precio, su
     descripción real y el botón de compra, sin que haya que navegar a otra
     página. Por eso el bloque de producto es grande y ocupa el ancho entero:
     no es un enlace al pie, es el destino de la lectura. -->
<div style="position:relative; width:1440px; background:var(--bg); color:var(--text);">
<!--@HEADER:historias:2:sticky@-->

  <div style="padding:22px 64px 0 64px;">
    <div style="font-size:12.5px; color:var(--text-faintest);">Inicio &nbsp;/&nbsp; Historias &nbsp;/&nbsp; <span style="color:var(--text-muted);"><!--@P:mascara-goma-17-michael-myers:nombre@--></span></div>
  </div>

  <!-- ============ portada de la historia ============ -->
  <div style="padding:26px 64px 0 64px;">
    <div class="rise" style="position:relative; height:430px; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--photo-shadow);"><img src="<!--@ARTE:cazador-enmascarado:banner@-->" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:20% 34%;">
      <div style="position:absolute; inset:0; background:linear-gradient(0deg, rgba(var(--bg-rgb),0.97) 12%, rgba(var(--bg-rgb),0.55) 52%, rgba(var(--bg-rgb),0.15) 100%);"></div>
      <div style="position:absolute; z-index:3; left:56px; right:56px; bottom:44px;">
        <div class="kicker" style="font-size:11px; color:var(--accent); margin-bottom:16px;"><!--@H:mascara-goma-17-michael-myers:kicker@--> · <!--@H:mascara-goma-17-michael-myers:lectura@--> min de lectura</div>
        <h1 class="dsp" style="font-weight:800; font-size:64px; line-height:1.0; letter-spacing:-0.03em; color:var(--text-hi); margin:0; max-width:900px;"><!--@H:mascara-goma-17-michael-myers:titulo@--></h1>
      </div>
    </div>
  </div>

  <!-- ============ el texto ============ -->
  <div style="padding:52px 64px 0 64px;">
    <div style="max-width:720px; margin:0 auto;">
      <p class="dsp" style="font-weight:600; font-size:25px; line-height:1.45; letter-spacing:-0.01em; color:var(--text-hi); margin:0 0 32px 0; text-wrap:pretty;"><!--@H:mascara-goma-17-michael-myers:entrada@--></p>
      <div style="width:64px; height:1px; background:var(--accent-deep); margin:0 0 32px 0;"></div>
      <!--@H:mascara-goma-17-michael-myers:parrafos@-->
      <p class="dsp-i" style="font-size:20px; line-height:1.6; color:var(--text-link); margin:34px 0 0 0; padding-left:22px; border-left:2px solid var(--accent-deep);"><!--@H:mascara-goma-17-michael-myers:cierre@--></p>
    </div>
  </div>

  <!-- ============ la salida: el producto ============
       Aquí termina la lectura y empieza la compra. Foto real, precio real,
       descripción real del producto.txt y botón. Un solo producto: esta
       historia es de esta pieza. -->
  <div style="padding:64px 64px 0 64px;">
    <div style="display:grid; grid-template-columns: 460px 1fr; gap:52px; align-items:center; background:linear-gradient(120deg, var(--bg-raised-2), var(--bg-raised)); border:1px solid var(--border); border-radius:18px; padding:44px 48px;">
      <div class="pbg" style="height:400px; border-radius:14px;"><!--@IMG:mascara-goma-17-michael-myers:340@--></div>
      <div>
        <div class="kicker" style="font-size:10px; color:var(--accent); margin-bottom:14px;">La pieza de esta historia</div>
        <h2 class="dsp" style="font-weight:800; font-size:44px; line-height:1.05; letter-spacing:-0.025em; color:var(--text-hi); margin:0 0 16px 0;"><!--@P:mascara-goma-17-michael-myers:nombre@--></h2>
        <span class="mono" style="display:inline-block; font-size:9.5px; letter-spacing:0.1em; border:1px solid var(--border); color:var(--text-muted); padding:4px 9px; border-radius:4px; margin-bottom:18px;"><!--@P:mascara-goma-17-michael-myers:cat@--></span>
        <p style="font-size:15.5px; line-height:1.75; color:var(--text-muted); margin:0 0 30px 0; max-width:520px;"><!--@P:mascara-goma-17-michael-myers:desc@--></p>

        <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px;">
          <span class="dsp" style="font-weight:800; font-size:46px; color:var(--text-hi);"><!--@P:mascara-goma-17-michael-myers:precio@--></span>
          <div class="btn-p" style="padding:17px 34px; font-size:15.5px;">Agregar al carrito</div>
          <div class="btn-s" style="padding:17px 30px; font-size:15.5px;">Comprar ahora</div>
        </div>
        <div class="mono" style="font-size:11.5px; color:var(--text-faintest);">Entrega 24–48 h en Lima · Cambios en 7 días</div>
      </div>
    </div>
  </div>

  <!-- ============ seguir leyendo ============ -->
  <div style="padding:64px 64px 84px 64px;">
    <div style="display:flex; align-items:flex-end; justify-content:space-between; border-top:1px solid var(--line); padding-top:30px; margin-bottom:24px;">
      <h2 class="dsp" style="font-weight:700; font-size:30px; letter-spacing:-0.02em; color:var(--text-hi); margin:0;">Seguir leyendo</h2>
      <span style="font-size:14px; color:var(--accent); display:inline-flex; align-items:center; gap:7px;">Las <!--@N:historias@--> historias <!--@ICON:arrow@--></span>
    </div>
    <div style="display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:24px;">

      <a class="card-hov" style="display:block; background:var(--bg-raised); border:1px solid var(--line); border-radius:14px; overflow:hidden;">
        <div class="pbg" style="height:200px;"><!--@IMG:mascara-goma-23-payaso-it:168@--></div>
        <div style="padding:20px;">
          <div class="kicker" style="font-size:9.5px; color:var(--accent); margin-bottom:10px;"><!--@H:mascara-goma-23-payaso-it:kicker@--></div>
          <h3 class="dsp" style="font-weight:700; font-size:19px; line-height:1.2; color:var(--text-hi); margin:0 0 12px 0; min-height:46px;"><!--@H:mascara-goma-23-payaso-it:titulo@--></h3>
          <span class="mono" style="font-size:12px; color:var(--text-muted);"><!--@P:mascara-goma-23-payaso-it:nombre@--> · <!--@P:mascara-goma-23-payaso-it:precio@--></span>
        </div>
      </a>

      <a class="card-hov" style="display:block; background:var(--bg-raised); border:1px solid var(--line); border-radius:14px; overflow:hidden;">
        <div class="pbg" style="height:200px;"><!--@IMG:mascara-goma-08-donnie-darko-conejo:168@--></div>
        <div style="padding:20px;">
          <div class="kicker" style="font-size:9.5px; color:var(--accent); margin-bottom:10px;"><!--@H:mascara-goma-08-donnie-darko-conejo:kicker@--></div>
          <h3 class="dsp" style="font-weight:700; font-size:19px; line-height:1.2; color:var(--text-hi); margin:0 0 12px 0; min-height:46px;"><!--@H:mascara-goma-08-donnie-darko-conejo:titulo@--></h3>
          <span class="mono" style="font-size:12px; color:var(--text-muted);"><!--@P:mascara-goma-08-donnie-darko-conejo:nombre@--> · <!--@P:mascara-goma-08-donnie-darko-conejo:precio@--></span>
        </div>
      </a>

      <a class="card-hov" style="display:block; background:var(--bg-raised); border:1px solid var(--line); border-radius:14px; overflow:hidden;">
        <div class="pbg" style="height:200px;"><!--@IMG:mascara-plastico-01-anonymous-vendetta:168@--></div>
        <div style="padding:20px;">
          <div class="kicker" style="font-size:9.5px; color:var(--accent); margin-bottom:10px;"><!--@H:mascara-plastico-01-anonymous-vendetta:kicker@--></div>
          <h3 class="dsp" style="font-weight:700; font-size:19px; line-height:1.2; color:var(--text-hi); margin:0 0 12px 0; min-height:46px;"><!--@H:mascara-plastico-01-anonymous-vendetta:titulo@--></h3>
          <span class="mono" style="font-size:12px; color:var(--text-muted);"><!--@P:mascara-plastico-01-anonymous-vendetta:nombre@--> · <!--@P:mascara-plastico-01-anonymous-vendetta:precio@--></span>
        </div>
      </a>

    </div>
  </div>

<!--@FOOTER@-->
<!--@FAB@-->
</div>
